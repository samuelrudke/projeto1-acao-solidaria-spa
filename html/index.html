<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Ação Solidária - SPA</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header>
        <!-- Logótipo otimizado com formato WebP e dimensões explícitas -->
        <img src="../img/logo.webp" alt="Logótipo oficial da ONG Ação Solidária" width="50" height="50">
        
        <!-- Botão com atributo ARIA para acessibilidade do tema de alto contraste -->
        <button id="btn-tema" class="btn-tema" aria-label="Alternar modo de alto contraste" type="button">☀️ Tema Claro</button>
        
        <!-- Botão de menu mobile com estados dinâmicos para leitores de ecrã -->
        <button class="menu-toggle" aria-label="Abrir Menu de Navegação" aria-expanded="false" aria-controls="menu-principal" type="button">☰</button>

        <nav aria-label="Navegação Principal">
            <ul id="menu-principal">
                <li><a href="#inicio" data-rota="inicio">Início</a></li>
                <li class="dropdown">
                    <a href="#projetos" data-rota="projetos" aria-haspopup="true" aria-expanded="false">Projetos ▾</a>
                    <ul class="dropdown-menu" aria-label="Submenu de Projetos">
                        <li><a href="#projetos" data-rota="projetos">Educação</a></li>
                        <li><a href="#projetos" data-rota="projetos">Saúde</a></li>
                        <li><a href="#projetos" data-rota="projetos">Comunitário</a></li>
                    </ul>
                </li>
                <li><a href="#cadastro" data-rota="cadastro">Quero Ajudar</a></li>
            </ul>
        </nav>
    </header>

    <!-- Container acessível onde as rotas e templates são injetados -->
    <main id="app" tabindex="-1" aria-live="polite"></main> 

    <footer>
        <p>&copy; 2026 ONG Ação Solidária. Todos os direitos reservados.</p>
    </footer>

    <!-- Bibliotecas externas por CDN -->
    <script src="https://unpkg.com/imask"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts do projeto carregados como Módulos ES6 para o Vite processar -->
    <script type="module" src="../js/templates.js"></script>
    <script type="module" src="../js/app.js"></script>

</body>
</html>
